{% extends "base.html" %}
{% block title %}Edit {{ product.name }} | InvoicePro{% endblock %}
{% block body %}
<main class="page-wrap">
    <header class="topbar">
        <div><p class="eyebrow">Products</p><h1>Edit {{ product.name }}</h1></div>
        <div class="topbar-actions"><a href="{{ url_for('products.index') }}" class="btn btn-ghost">← Back</a></div>
    </header>
    <article class="panel" style="max-width:640px">
        <form method="post">
            {{ form.hidden_tag() }}
            <div class="form-grid two-col" style="margin-top:0">
                <label class="full-width"><span>{{ form.name.label.text }}</span>{{ form.name() }}{% for e in form.name.errors %}<span class="error">{{ e }}</span>{% endfor %}</label>
                <label class="full-width"><span>{{ form.description.label.text }}</span>{{ form.description(rows="2") }}</label>
                <label><span>{{ form.hsn_sac.label.text }}</span>{{ form.hsn_sac() }}</label>
                <label><span>{{ form.unit.label.text }}</span>{{ form.unit() }}</label>
                <label><span>{{ form.price.label.text }}</span>{{ form.price(step="0.01", min="0") }}{% for e in form.price.errors %}<span class="error">{{ e }}</span>{% endfor %}</label>
                <label><span>{{ form.gst_rate.label.text }}</span>{{ form.gst_rate() }}</label>
            </div>
            <div class="form-actions">
                {{ form.submit(class_="btn btn-primary") }}
                <a href="{{ url_for('products.index') }}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </article>
</main>
{% endblock %}
