{% extends "base.html" %}
{% block title %}Login | InvoicePro{% endblock %}
{% block body %}
<main class="auth-layout">
    <section class="auth-card">
        <div>
            <p class="eyebrow">InvoicePro</p>
            <h1>Sign in</h1>
            <p class="muted">Use your account to access the invoice workspace.</p>
        </div>
        <form method="post" class="form-grid">
            {{ form.hidden_tag() }}
            <label>
                <span>{{ form.email.label.text }}</span>
                {{ form.email(placeholder="you@company.com") }}
                {% for error in form.email.errors %}<small class="error">{{ error }}</small>{% endfor %}
            </label>
            <label>
                <span>{{ form.password.label.text }}</span>
                {{ form.password(placeholder="Enter your password") }}
                {% for error in form.password.errors %}<small class="error">{{ error }}</small>{% endfor %}
            </label>
            {{ form.submit(class_="btn btn-primary") }}
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
            <a href="{{ url_for('auth.register') }}">Create account</a>
        </div>
    </section>
</main>
{% endblock %}
